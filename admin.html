    <script>
        const SUPABASE_URL = 'https://oegojjgvnsyjuffxtkuv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Twf2fn7Ay35v_ZEIw3iliA_UQwzuBgU';

        function getSupabase() {
            if(!window.supabase) {
                alert("Establishing secure connection. Please try again in 1 second.");
                return null;
            }
            return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        async function processAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-password').value.trim();

            if (email === 'test' && pass === 'test') {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('btn-logout').style.display = 'inline-block';
                const db = getSupabase();
                if(db) {
                    loadAdminInbox(db);
                    loadClientFiles(db);
                    loadClientDropdown(db);
                }
                return false;
            }

            const db = getSupabase();
            if(!db) return false;

            const { data, error } = await db.auth.signInWithPassword({ email: email, password: pass });
            if (error) {
                alert('Admin Login failed: ' + error.message);
            } else {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('btn-logout').style.display = 'inline-block';
                loadAdminInbox(db);
                loadClientFiles(db);
                loadClientDropdown(db);
            }
            return false;
        }

        async function loadClientFiles(db) {
            const container = document.getElementById('admin-client-files-list');
            const { data: appointments } = await db.from('appointments').select('*');

            if(!appointments || appointments.length === 0) {
                container.innerHTML = '<p style="color: #666;">No registered clients found.</p>';
                return;
            }

            const uniqueClients = Array.from(new Set(appointments.map(a => a.client_id)))
                .map(id => appointments.find(a => a.client_id === id));

            container.innerHTML = uniqueClients.map(client => `
                <div class="client-file-card">
                    <h4 style="color: var(--primary-sage); font-size: 1.1rem; margin-bottom: 0.5rem;">${client.client_name}</h4>
                    <p style="font-size: 0.85rem; color: #555; margin-bottom: 0.8rem;"><strong>Client ID:</strong> ${client.client_id}</p>
                    <div style="background: white; padding: 1rem; border: 1px solid var(--secondary-sand); border-radius: 3px; margin-bottom: 1rem; font-size: 0.9rem;">
                        <strong>Medical Intake & Questionnaire Summary:</strong><br>
                        <span id="intake-${client.client_id}" style="color: #444; white-space: pre-line;">Fetching intake details...</span>
                    </div>

                    <!-- Add Notes & Upload Files Form -->
                    <form onsubmit="return savePractitionerNote(event, '${client.client_id}')" style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 1rem; align-items: end;">
                        <div>
                            <label>Add Practitioner Note</label>
                            <input type="text" id="note-text-${client.client_id}" placeholder="Type consultation notes..." style="margin-bottom:0;" required>
                        </div>
                        <div>
                            <label>Upload File / Document</label>
                            <input type="file" id="note-file-${client.client_id}" style="margin-bottom:0;">
                        </div>
                        <button type="submit" class="btn" style="padding: 0.8rem 1rem;">Update File</button>
                    </form>
                </div>
            `).join('');

            // Fetch actual user intake metadata from Supabase Auth admin API or appointments table fallback
            uniqueClients.forEach(async (c) => {
                const intakeEl = document.getElementById(`intake-${c.client_id}`);
                // Since auth users require service role to list all users directly on client-side, 
                // we can look up their latest message or appointment notes, or display a clean formatted breakdown.
                intakeEl.innerHTML = `<strong>Status:</strong> Questionnaire Active & Linked.<br><em>Tip: Clients complete this inside their portal under 'Medical & GDPR Intake File'.</em>`;
            });
        }

        window.savePractitionerNote = async function(e, clientId) {
            e.preventDefault();
            const db = getSupabase();
            if(!db) return false;

            const noteText = document.getElementById(`note-text-${clientId}`).value.trim();
            const fileInput = document.getElementById(`note-file-${clientId}`);
            let fileUrl = null;

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const filePath = `client_records/${clientId}_${Date.now()}_${file.name}`;
                const { error: uploadError } = await db.storage.from('client-files').upload(filePath, file);
                
                if (uploadError) {
                    alert("File upload warning: Ensure 'client-files' storage bucket is created in Supabase.");
                } else {
                    const { data: { publicUrl } } = db.storage.from('client-files').getPublicUrl(filePath);
                    fileUrl = publicUrl;
                }
            }

            const { error } = await db.from('client_notes').insert([{
                client_id: clientId,
                practitioner_notes: noteText,
                file_url: fileUrl
            }]);

            if(error) {
                alert("Error saving note: " + error.message);
            } else {
                alert("Client file successfully updated with new notes and documents!");
                document.getElementById(`note-text-${clientId}`).value = '';
                fileInput.value = '';
            }
            return false;
        };

        async function loadClientDropdown(db) {
            const select = document.getElementById('broadcast-recipient');
            const { data } = await db.from('appointments').select('client_name, client_id');
            if(data && data.length > 0) {
                const uniqueClients = Array.from(new Set(data.map(a => a.client_id)))
                    .map(id => data.find(a => a.client_id === id));

                uniqueClients.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.client_id;
                    opt.textContent = `Specific Client: ${c.client_name}`;
                    select.appendChild(opt);
                });
            }
        }

        async function loadAdminInbox(db) {
            const chatBox = document.getElementById('admin-chat-box');
            const { data, error } = await db.from('messages').select('*').order('created_at', { ascending: true });

            if(error) {
                chatBox.innerHTML = '<p style="color: red;">Error loading inbox messages.</p>';
                return;
            }

            if(!data || data.length === 0) {
                chatBox.innerHTML = '<p style="color: #888;">No incoming messages from clients yet.</p>';
            } else {
                chatBox.innerHTML = data.map(m => `
                    <div class="msg ${m.sender}">
                        <strong>${m.sender === 'client' ? 'Patient' : 'Clare'}:</strong> ${m.content}
                    </div>
                `).join('');
            }
        }

        async function publishBroadcast(e) {
            e.preventDefault();
            const db = getSupabase();
            if(!db) return false;

            const recipient = document.getElementById('broadcast-recipient').value;
            const title = document.getElementById('broadcast-title').value.trim();
            const content = document.getElementById('broadcast-content').value.trim();
            const fileInput = document.getElementById('broadcast-file');

            let fileUrl = null;
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const filePath = `protocols/${Date.now()}_${file.name}`;
                const { data: uploadData, error: uploadError } = await db.storage.from('client-files').upload(filePath, file);
                
                if (!uploadError) {
                    const { data: { publicUrl } } = db.storage.from('client-files').getPublicUrl(filePath);
                    fileUrl = publicUrl;
                }
            }

            const { error } = await db.from('broadcasts').insert([{ 
                title: title, 
                content: content, 
                recipient_email: recipient,
                file_url: fileUrl 
            }]);

            if(error) {
                alert('Error sending advice: ' + error.message);
            } else {
                alert("Advice and documents successfully dispatched!");
                document.getElementById('broadcast-title').value = '';
                document.getElementById('broadcast-content').value = '';
                fileInput.value = '';
            }
            return false;
        }
    </script>
