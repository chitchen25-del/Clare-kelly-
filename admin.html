<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Practitioner Dashboard | The Natural Healing Clinic</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #F7F6F2; --text-main: #252D26; --primary-sage: #4A594D; --secondary-sand: #E5E2D9; --gold-accent: #C5A880; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cormorant Garamond', serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.8; font-size: 1.125rem; overflow-x: hidden; }
        h1, h2, h3, h4, th, .nav-logo, .btn { font-family: 'Montserrat', sans-serif; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 4%; background: white; border-bottom: 1px solid var(--secondary-sand); }
        .nav-logo { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--primary-sage); letter-spacing: 1.5px; }
        .btn { padding: 0.8rem 1.4rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; border-radius: 2px; cursor: pointer; border: none; background: var(--primary-sage); color: white; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-outline { background: transparent; border: 1px solid var(--primary-sage); color: var(--primary-sage); }
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 1rem; }
        .form-container { width: 100%; max-width: 400px; background: white; padding: 2.5rem 1.5rem; border-radius: 4px; border: 1px solid var(--secondary-sand); text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.04); }
        label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: #555; margin-bottom: 0.4rem; text-align: left; font-weight: 600; font-family: 'Montserrat', sans-serif; }
        input, select, textarea { width: 100%; padding: 0.9rem; margin-bottom: 1.2rem; border: 1px solid var(--secondary-sand); border-radius: 2px; font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; background: #fff; appearance: none; -webkit-appearance: none; }
        .dashboard-wrapper { display: none; max-width: 1200px; margin: 2rem auto; padding: 0 4%; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        .panel { background: white; padding: 1.8rem 1.2rem; border-radius: 4px; border: 1px solid var(--secondary-sand); margin-bottom: 1.5rem; box-shadow: 0 5px 20px rgba(0,0,0,0.02); }
        .panel h3 { font-size: 1.15rem; color: var(--primary-sage); margin-bottom: 1.2rem; border-bottom: 1px solid var(--secondary-sand); padding-bottom: 0.6rem; font-weight: 500; }
        .chat-box { height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #F4F3EE; padding: 1rem; border-radius: 3px; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
        .msg { padding: 0.8rem 1rem; border-radius: 4px; max-width: 90%; font-size: 1rem; }
        .msg.client { background: white; border: 1px solid var(--secondary-sand); align-self: flex-start; }
        .msg.admin { background: var(--primary-sage); color: white; align-self: flex-end; }
        .client-file-card { background: #FAF9F5; border: 1px solid var(--secondary-sand); padding: 1.5rem 1rem; border-radius: 4px; margin-bottom: 1.2rem; }

        @media (min-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr 1fr; gap: 3rem; }
            .dashboard-wrapper { margin: 4rem auto; padding: 0 4%; }
            .panel { padding: 2.5rem; }
            .form-container { max-width: 420px; padding: 3.5rem; }
            .client-file-card { padding: 2rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">Practitioner Admin</div>
        <button id="btn-logout" class="btn btn-outline" style="display: none;" onclick="location.reload();">Sign Out</button>
    </nav>

    <div id="admin-login" class="login-wrapper">
        <div class="form-container">
            <h2>Authorized Access</h2>
            <form onsubmit="return processAdminLogin(event)">
                <label>Admin Email</label><input type="text" id="admin-email" placeholder="test or email" required>
                <label>Password</label><input type="password" id="admin-password" placeholder="test or password" required>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Secure Login</button>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" class="dashboard-wrapper">
        <div style="margin-bottom: 2.5rem; border-bottom: 2px solid var(--secondary-sand); padding-bottom: 1rem;">
            <h1 style="font-size: 2rem; font-weight: 300;">Welcome, Clare</h1>
        </div>

        <div class="dashboard-grid">
            <div class="panel" style="grid-column: 1 / -1;">
                <h3>Client Files & Medical Questionnaires</h3>
                <div id="admin-client-files-list"><p style="color: #888;">Loading client records...</p></div>
            </div>

            <div class="panel">
                <h3>Live Patient Inbox</h3>
                <div class="chat-box" id="admin-chat-box"><p style="color: #888;">Loading messages...</p></div>
            </div>

            <div class="panel">
                <h3>Send Advice & Files</h3>
                <form onsubmit="return publishBroadcast(event)">
                    <label>Send To</label>
                    <select id="broadcast-recipient">
                        <option value="all">All Clients (Mass Broadcast)</option>
                    </select>
                    <label>Title</label><input type="text" id="broadcast-title" required>
                    <label>Content</label><textarea id="broadcast-content" required></textarea>
                    <label>Attach File</label><input type="file" id="broadcast-file">
                    <button type="submit" class="btn" style="width: 100%;">Dispatch</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oegojjgvnsyjuffxtkuv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Twf2fn7Ay35v_ZEIw3iliA_UQwzuBgU';
        let lastMessageCount = 0;

        function getSupabase() {
            if(!window.supabase) return null;
            return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        async function processAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-password').value.trim();

            if (email === 'test' && pass === 'test') {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('btn-logout').style.display = 'inline-block';
                const db = getSupabase();
                loadAdminInbox(db); loadClientFiles(db); loadClientDropdown(db);
                setInterval(() => loadAdminInbox(db, true), 10000);
                return false;
            }

            const db = getSupabase();
            const { error } = await db.auth.signInWithPassword({ email, password: pass });
            if (error) alert('Login failed: ' + error.message);
            else {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('btn-logout').style.display = 'inline-block';
                loadAdminInbox(db); loadClientFiles(db); loadClientDropdown(db);
                setInterval(() => loadAdminInbox(db, true), 10000);
            }
            return false;
        }

        async function loadClientFiles(db) {
            const container = document.getElementById('admin-client-files-list');
            const { data: appts } = await db.from('appointments').select('*');
            const { data: msgs } = await db.from('messages').select('*');

            if(!appts || appts.length === 0) { container.innerHTML = '<p style="color: #666;">No clients found.</p>'; return; }

            const uniqueClients = Array.from(new Set(appts.map(a => a.client_id))).map(id => appts.find(a => a.client_id === id));

            container.innerHTML = uniqueClients.map(client => {
                const clientMsgs = msgs ? msgs.filter(m => m.client_id === client.client_id) : [];
                const intakeMsg = clientMsgs.find(m => m.content && m.content.includes('[MEDICAL INTAKE SUBMISSION]'));
                let intakeDisplay = intakeMsg ? intakeMsg.content.replace('[MEDICAL INTAKE SUBMISSION]', '').trim() : 'Questionnaire not yet completed.';

                return `
                    <div class="client-file-card">
                        <h4 style="color: var(--primary-sage); font-size: 1.1rem; margin-bottom: 0.3rem;">${client.client_name}</h4>
                        <p style="font-size: 0.75rem; color: #666; margin-bottom: 1rem;">ID: ${client.client_id}</p>
                        <div style="background: white; padding: 1.2rem; border: 1px solid var(--secondary-sand); border-radius: 3px; margin-bottom: 1rem; font-size: 0.95rem;">
                            <strong>Medical Questionnaire:</strong><br>
                            <pre style="margin-top: 0.6rem; color: #333; background: #FAFAF7; padding: 1rem; border-radius: 3px; border-left: 3px solid var(--primary-sage); font-family: inherit; white-space: pre-wrap;">${intakeDisplay}</pre>
                        </div>
                        <form onsubmit="return savePractitionerNote(event, '${client.client_id}')" style="display: flex; flex-direction: column; gap: 0.8rem;">
                            <input type="text" id="note-text-${client.client_id}" placeholder="Type consultation notes..." style="margin-bottom:0;" required>
                            <input type="file" id="note-file-${client.client_id}" style="margin-bottom:0;">
                            <button type="submit" class="btn">Update File</button>
                        </form>
                    </div>`;
            }).join('');
        }

        window.savePractitionerNote = async function(e, clientId) {
            e.preventDefault();
            const db = getSupabase();
            const noteText = document.getElementById(`note-text-${clientId}`).value.trim();
            const fileInput = document.getElementById(`note-file-${clientId}`);
            let fileUrl = null;

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const filePath = `client_records/${clientId}_${Date.now()}_${file.name}`;
                const { error: uploadError } = await db.storage.from('client-files').upload(filePath, file);
                if (!uploadError) {
                    const { data: { publicUrl } } = db.storage.from('client-files').getPublicUrl(filePath);
                    fileUrl = publicUrl;
                }
            }

            await db.from('client_notes').insert([{ client_id: clientId, practitioner_notes: noteText, file_url: fileUrl }]);
            alert("Client file successfully updated!");
            document.getElementById(`note-text-${clientId}`).value = '';
            fileInput.value = '';
            return false;
        };

        async function loadClientDropdown(db) {
            const select = document.getElementById('broadcast-recipient');
            const { data } = await db.from('appointments').select('client_name, client_id');
            if(data) {
                const uniqueClients = Array.from(new Set(data.map(a => a.client_id))).map(id => data.find(a => a.client_id === id));
                uniqueClients.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.client_id;
                    opt.textContent = `Specific Client: ${c.client_name}`;
                    select.appendChild(opt);
                });
            }
        }

        async function loadAdminInbox(db, isPolling = false) {
            const chatBox = document.getElementById('admin-chat-box');
            const { data } = await db.from('messages').select('*').order('created_at', { ascending: true });
            if(!data || data.length === 0) { chatBox.innerHTML = '<p style="color: #888;">No messages yet.</p>'; return; }

            if (isPolling && data.length > lastMessageCount && lastMessageCount > 0) {
                document.title = "🔔 NEW MESSAGE - Admin";
            }
            lastMessageCount = data.length;

            chatBox.innerHTML = data.map(m => `<div class="msg ${m.sender}"><strong>${m.sender === 'client' ? 'Patient' : 'Clare'}:</strong> ${m.content}</div>`).join('');
        }

        async function publishBroadcast(e) {
            e.preventDefault();
            const db = getSupabase();
            const recipient = document.getElementById('broadcast-recipient').value;
            const title = document.getElementById('broadcast-title').value.trim();
            const content = document.getElementById('broadcast-content').value.trim();
            const fileInput = document.getElementById('broadcast-file');
            let fileUrl = null;

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const filePath = `protocols/${Date.now()}_${file.name}`;
                const { error: uploadError } = await db.storage.from('client-files').upload(filePath, file);
                if (!uploadError) {
                    const { data: { publicUrl } } = db.storage.from('client-files').getPublicUrl(filePath);
                    fileUrl = publicUrl;
                }
            }

            await db.from('broadcasts').insert([{ title, content, recipient_email: recipient, file_url: fileUrl }]);
            alert("Dispatched successfully!");
            document.getElementById('broadcast-title').value = '';
            document.getElementById('broadcast-content').value = '';
            fileInput.value = '';
            return false;
        }
    </script>
</body>
</html>
