<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Practitioner Dashboard | The Natural Healing Clinic</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #FAFAF7; --text-main: #2C352D; --primary-sage: #5A6B5D; --secondary-sand: #E3E0D8; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lora', serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.7; }
        h1, h2, h3, h4, th, .nav-logo, .btn { font-family: 'Montserrat', sans-serif; }
        nav { display: flex; justify-content: space-between; padding: 1rem 5%; background: white; border-bottom: 1px solid var(--secondary-sand); }
        .nav-logo { font-size: 1rem; font-weight: 600; text-transform: uppercase; color: var(--primary-sage); }
        .btn { padding: 0.8rem 1.5rem; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; border-radius: 4px; cursor: pointer; border: none; background: var(--primary-sage); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary-sage); color: var(--primary-sage); }
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 1rem; }
        .form-container { width: 100%; max-width: 400px; background: white; padding: 3rem 2.5rem; border-radius: 6px; border: 1px solid var(--secondary-sand); text-align: center; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; color: #555; margin-bottom: 0.4rem; text-align: left; font-weight: 600;}
        input, textarea { width: 100%; padding: 0.8rem; margin-bottom: 1.2rem; border: 1px solid var(--secondary-sand); border-radius: 3px; font-family: 'Lora', serif; }
        .dashboard-wrapper { display: none; max-width: 1400px; margin: 3rem auto; padding: 0 2%; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .panel { background: white; padding: 1.5rem; border-radius: 6px; border: 1px solid var(--secondary-sand); margin-bottom: 1.5rem; }
        .panel h3 { font-size: 1.1rem; color: var(--primary-sage); margin-bottom: 1.5rem; border-bottom: 1px solid var(--secondary-sand); padding-bottom: 0.5rem; }
        .chat-box { height: 300px; overflow-y: auto; background: #F4F3EE; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .msg { padding: 0.8rem; border-radius: 6px; max-width: 80%; font-size: 0.9rem; }
        .msg.client { background: white; border: 1px solid var(--secondary-sand); align-self: flex-start; }
        .msg.admin { background: var(--primary-sage); color: white; align-self: flex-end; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">Practitioner Admin</div>
        <button id="btn-logout" class="btn btn-outline" style="display: none;" onclick="location.reload();">Sign Out</button>
    </nav>

    <div id="admin-login" class="login-wrapper">
        <div class="form-container">
            <h2>Authorized Access</h2>
            <form onsubmit="return processAdminLogin(event)">
                <label>Admin Email</label><input type="email" id="admin-email" required>
                <label>Password</label><input type="password" id="admin-password" required>
                <button type="submit" class="btn" style="width: 100%;">Secure Login</button>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" class="dashboard-wrapper">
        <div style="margin-bottom: 2rem; border-bottom: 2px solid var(--secondary-sand); padding-bottom: 1rem;">
            <h1 style="font-size: 2.2rem; font-weight: 300;">Welcome, Clare</h1>
        </div>

        <div class="dashboard-grid">
            <!-- INBOX PANEL -->
            <div class="panel">
                <h3>Live Patient Inbox</h3>
                <p style="font-size: 0.85rem; color: #666; margin-bottom: 1rem;">Messages sent from active client portals.</p>
                <div class="chat-box" id="admin-chat-box">
                    <p style="color: #888;">Loading messages from database...</p>
                </div>
            </div>

            <!-- BROADCAST PANEL -->
            <div class="panel">
                <h3>Publish Health Article / Broadcast</h3>
                <p style="font-size: 0.85rem; color: #666; margin-bottom: 1rem;">Publish an article or update directly to all client portals.</p>
                <form onsubmit="return publishBroadcast(event)">
                    <label>Article Title / Subject</label>
                    <input type="text" id="broadcast-title" placeholder="e.g. Navigating Seasonal Allergies" required>
                    <label>Content</label>
                    <textarea id="broadcast-content" style="height: 150px;" placeholder="Write your advice or announcement here..." required></textarea>
                    <button type="submit" class="btn" style="width: 100%;">Publish to All Clients</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oegojjgvnsyjuffxtkuv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Twf2fn7Ay35v_ZEIw3iliA_UQwzuBgU';

        function getSupabase() {
            if(!window.supabase) {
                alert("Establishing secure connection. Please try again in 1 second.");
                return null;
            }
            return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        async function processAdminLogin(e) {
            e.preventDefault();
            const db = getSupabase();
            if(!db) return false;

            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-password').value.trim();

            const { data, error } = await db.auth.signInWithPassword({ email: email, password: pass });
            
            if (error) {
                alert('Admin Login failed: ' + error.message);
            } else {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('btn-logout').style.display = 'inline-block';
                loadAdminInbox(db);
            }
            return false;
        }

        async function loadAdminInbox(db) {
            const chatBox = document.getElementById('admin-chat-box');
            const { data, error } = await db.from('messages').select('*').order('created_at', { ascending: true });

            if(error) {
                chatBox.innerHTML = '<p style="color: red;">Error loading inbox messages.</p>';
                return;
            }

            if(!data || data.length === 0) {
                chatBox.innerHTML = '<p style="color: #888;">No incoming messages from clients yet.</p>';
            } else {
                chatBox.innerHTML = data.map(m => `
                    <div class="msg ${m.sender}">
                        <strong>${m.sender === 'client' ? 'Patient' : 'Clare'}:</strong> ${m.content}
                    </div>
                `).join('');
            }
        }

        async function publishBroadcast(e) {
            e.preventDefault();
            const db = getSupabase();
            if(!db) return false;

            const title = document.getElementById('broadcast-title').value.trim();
            const content = document.getElementById('broadcast-content').value.trim();

            const { error } = await db.from('broadcasts').insert([{ title: title, content: content }]);

            if(error) {
                alert('Error publishing broadcast: ' + error.message);
            } else {
                alert("Broadcast successfully published to all client dashboards!");
                document.getElementById('broadcast-title').value = '';
                document.getElementById('broadcast-content').value = '';
            }
            return false;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async defer></script>
</body>
</html>
