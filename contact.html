<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contact The Clinic | The Natural Healing Clinic</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?version=6">
</head>
<body>
    <nav>
        <img src="./logo.png" alt="The Natural Healing Clinic" class="nav-brand-logo" onclick="location.href='./index.html'">
        <div class="desktop-nav-links">
            <span class="nav-link-text" onclick="location.href='./index.html'">Home</span>
            <span class="nav-link-text" onclick="location.href='./about.html'">About Clare</span>
            <span class="nav-link-text" style="color: var(--primary-sage); font-weight: 700;">Contact</span>
            <button type="button" class="btn btn-outline" onclick="location.href='./app.html'">Patient Portal</button>
        </div>
    </nav>

    <!-- CONTACT SECTION -->
    <div style="background-color: var(--card-bg); padding: 5rem 6%; border-bottom: 1px solid var(--secondary-sand); text-align: center;">
        <span class="section-subtitle">Get In Touch</span>
        <h1 style="margin-top: 0.5rem;">Contact The Clinic</h1>
        <p style="color: #666; max-width: 600px; margin: 1rem auto 0 auto;">Have a question before booking? Send Clare a direct message.</p>
    </div>

    <section class="section" style="padding: 4rem 5%; display: flex; justify-content: center;">
        <div style="width: 100%; max-width: 600px; background: white; padding: 3rem 2.5rem; border-radius: 12px; border: 1px solid var(--secondary-sand); box-shadow: 0 10px 30px rgba(9, 93, 40, 0.05);">
            <form onsubmit="return submitPublicContact(event)">
                <label>Your Name</label>
                <input type="text" id="contact-name" required placeholder="e.g. Jane Doe">
                
                <label>Email Address</label>
                <input type="email" id="contact-email" required placeholder="To reply to you">
                
                <label>Phone Number (Optional)</label>
                <input type="tel" id="contact-phone" placeholder="If you'd prefer a text or call">

                <label>How can we help?</label>
                <textarea id="contact-message" required placeholder="Ask about treatments, availability, or your specific condition..." style="height: 150px;"></textarea>

                <button type="submit" id="contact-btn" class="btn" style="width: 100%;">Send Message</button>
                <p style="font-size: 0.75rem; color: #888; text-align: center; margin-top: 1rem; margin-bottom: 0;">We aim to respond to all inquiries within 24 hours.</p>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-logo-wrapper"><img src="./logo.png" alt="Logo" class="footer-brand-logo"></div>
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2rem; width: 100%;">
            <div class="footer-col" style="text-align: left;"><h4>The Natural Healing Clinic</h4><p>13 Cronk Drine, Union Mills, Isle of Man</p></div>
            <div class="footer-col" style="text-align: right;"><h4>Contact</h4><p>Tel: 07624 202 121</p></div>
        </div>
    </footer>
    <script src="./app.js?v=2"></script>
</body>
</html>
