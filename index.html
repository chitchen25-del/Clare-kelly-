<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lymphatic Wellness | Isle of Man</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #FAFAF7; --text-main: #2C352D; --primary-sage: #5A6B5D; }
        body { font-family: 'Lora', serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.7; }
        .hero { padding: 8rem 5%; text-align: center; }
        .btn { padding: 0.8rem 2rem; background: var(--primary-sage); color: white; text-decoration: none; border-radius: 3px; cursor: pointer; }
        #auth-section { display: none; padding: 4rem; text-align: center; border: 1px solid #ccc; margin: 2rem; }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Restore Your Body's Natural Flow</h1>
        <button id="portal-btn" class="btn">Access Client Portal</button>
    </section>

    <div id="auth-section">
        <h3>Client Login</h3>
        <input type="email" id="email" placeholder="Email"><br><br>
        <input type="password" id="password" placeholder="Password"><br><br>
        <button id="login-btn" class="btn">Login</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://oegojjgvnsyjuffxtkuv.supabase.co';
        const SUPABASE_KEY = 'YOUR_NEW_SECURE_API_KEY_HERE';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('portal-btn').onclick = () => {
            document.getElementById('auth-section').style.display = 'block';
        };

        document.getElementById('login-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else alert('Successfully logged in!');
        };
    </script>
</body>
</html>
