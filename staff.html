<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Pinch-zoom deliberately enabled. Do not add user-scalable=no. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practitioner | The Natural Healing Clinic</title>
<link rel="apple-touch-icon" href="./logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./vip.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script>
<style>
  .row{background:var(--card);border:1px solid var(--hair);border-radius:18px;
       padding:19px 20px;margin-bottom:11px;display:flex;align-items:center;gap:14px;
       cursor:pointer;width:100%;text-align:left;font-family:inherit;font-size:1rem;
       box-shadow:var(--lift-sm);transition:box-shadow .15s ease}
  .row:active{box-shadow:var(--lift)}
  .row .who{flex:1;min-width:0}
  .row .nm{font-weight:600;font-size:.98rem}
  .row .sub{font-size:.78rem;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .pill{font-size:.6rem;font-weight:700;padding:5px 11px;border-radius:20px;flex:none;
        letter-spacing:.09em;text-transform:uppercase}
  .pill.on{background:rgba(23,160,74,.12);color:var(--forest-mid)}
  .pill.off{background:var(--bone);color:var(--ink-faint)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .back{background:none;border:none;color:var(--forest-mid);font-family:inherit;
        font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
        padding:22px 0 12px;cursor:pointer}
  .subtle{font-size:.82rem;color:var(--ink-faint)}
  .logline{display:flex;justify-content:space-between;gap:12px;padding:13px 0;
           border-bottom:1px solid var(--hair);font-size:.9rem}
  .logline:last-child{border-bottom:none}
  .view{display:none}.view.on{display:block}
</style>
</head>
<body class="no-nav">

<div class="wrap">

  <!-- LOGIN -->
  <div id="v-login" class="view on">
    <div style="text-align:center;padding:56px 0 24px">
      <img src="./logo.png" alt="" style="height:60px;object-fit:contain">
      <h1 class="display" style="font-size:1.8rem;margin-top:16px">Practitioner</h1>
    </div>
    <div id="alert"></div>
    <div class="panel">
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" style="margin-bottom:16px" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit" class="primary" id="loginBtn">Sign in</button>
      </form>
    </div>
  </div>

  <!-- PATIENT LIST -->
  <div id="v-list" class="view">
    <div class="band">
      <p class="greet" id="whoami">&nbsp;</p>
      <p class="display" style="font-size:2.5rem">Patients</p>
    </div>
    <div id="alert2"></div>
    <div id="patientList"></div>
    <button type="button" class="ghost danger" id="signOut" style="margin-top:24px">Sign out</button>
  </div>

  <!-- PATIENT DETAIL -->
  <div id="v-detail" class="view">
    <button type="button" class="back" id="backBtn">&larr; All patients</button>
    <div class="band" style="margin-top:0">
      <p class="greet" id="dEmail">&nbsp;</p>
      <p class="display" style="font-size:2.2rem" id="dName">&nbsp;</p>
    </div>
    <div id="alert3"></div>

    <section>
      <h3>Programme</h3>
      <div id="progBox"></div>
    </section>

    <section>
      <h3>Supplements</h3>
      <div id="suppBox"></div>
    </section>

    <section>
      <h3>Recent check-ins</h3>
      <div id="checkBox"></div>
    </section>

    <section>
      <h3>Recent meals</h3>
      <div id="foodBox"></div>
    </section>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://oegojjgvnsyjuffxtkuv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Twf2fn7Ay35v_ZEIw3iliA_UQwzuBgU';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function el(tag, o = {}){
  const n = document.createElement(tag);
  if(o.class) n.className = o.class;
  if(o.text != null) n.textContent = o.text;
  if(o.attrs) for(const [k,v] of Object.entries(o.attrs)) n.setAttribute(k,v);
  return n;
}
const today = () => new Date().toLocaleDateString('en-CA');
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB',
  { day:'numeric', month:'short', year:'numeric' });

function say(msg, host = 'alert'){
  const h = document.getElementById(host);
  if(h) h.replaceChildren(el('div', { class:'err', text: msg }));
}
function clear(host = 'alert'){
  const h = document.getElementById(host);
  if(h) h.replaceChildren();
}
function show(view){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.getElementById('v-' + view).classList.add('on');
  window.scrollTo(0,0);
}

let current = null;   // patient being viewed

/* ---------------- Auth ---------------- */

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  clear();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Checking';

  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });

  if(error){
    say('That email and password did not match.');
    btn.disabled = false; btn.textContent = 'Sign in';
    return;
  }
  await afterLogin();
  btn.disabled = false; btn.textContent = 'Sign in';
});

/* The real gate. Signing in is not enough — the account must be staff.
   RLS would hide the data anyway, but this stops the page opening at all. */
async function afterLogin(){
  const { data: staff, error } = await db.rpc('is_staff');

  if(error || staff !== true){
    await db.auth.signOut();
    say('That account does not have practitioner access.');
    return;
  }

  const { data:{ user } } = await db.auth.getUser();
  document.getElementById('whoami').textContent = 'Signed in as ' + user.email;
  show('list');
  loadPatients();
}

document.getElementById('signOut').addEventListener('click', async () => {
  await db.auth.signOut();
  location.reload();
});

/* ---------------- Patient list ---------------- */

async function loadPatients(){
  const host = document.getElementById('patientList');
  host.replaceChildren(el('p', { class:'subtle', text:'Loading…' }));

  const [{ data: people, error }, { data: progs }] = await Promise.all([
    db.from('profiles').select('*').eq('role','patient').order('created_at'),
    db.from('programmes').select('client_id,start_date,end_date')
  ]);

  if(error){ say('Could not load patients.', 'alert2'); host.replaceChildren(); return; }

  host.replaceChildren();
  if(!people || people.length === 0){
    host.append(el('div', { class:'empty',
      text:'No patients yet. Accounts appear here once someone signs up.' }));
    return;
  }

  const t = today();
  const activeIds = new Set((progs||[])
    .filter(p => p.start_date <= t && p.end_date >= t)
    .map(p => p.client_id));

  people.forEach(p => {
    const btn = el('button', { class:'row', attrs:{ type:'button' } });
    const who = el('div', { class:'who' });
    who.append(el('div', { class:'nm', text: p.full_name || 'Unnamed patient' }));
    who.append(el('div', { class:'sub', text: p.email || '' }));
    btn.append(who);
    btn.append(el('span', {
      class: 'pill ' + (activeIds.has(p.id) ? 'on' : 'off'),
      text: activeIds.has(p.id) ? 'Active' : 'No programme'
    }));
    btn.addEventListener('click', () => openPatient(p));
    host.append(btn);
  });
}

document.getElementById('backBtn').addEventListener('click', () => {
  show('list'); loadPatients();
});

/* ---------------- Patient detail ---------------- */

async function openPatient(p){
  current = p;
  show('detail');
  clear('alert3');
  document.getElementById('dName').textContent = p.full_name || 'Unnamed patient';
  document.getElementById('dEmail').textContent = p.email || '';

  ['progBox','suppBox','checkBox','foodBox'].forEach(id =>
    document.getElementById(id).replaceChildren(el('p', { class:'subtle', text:'Loading…' })));

  const [prog, supps, checks, food] = await Promise.all([
    db.from('programmes').select('*').eq('client_id', p.id)
      .order('start_date',{ascending:false}).limit(1).maybeSingle(),
    db.from('client_supplements').select('*').eq('client_id', p.id).order('sort_order'),
    db.from('daily_checkins').select('*').eq('client_id', p.id)
      .order('log_date',{ascending:false}).limit(14),
    db.from('food_log').select('*').eq('client_id', p.id)
      .order('log_date',{ascending:false}).limit(15)
  ]);

  renderProgramme(prog.data);
  renderSupplements(supps.data || []);
  renderChecks(checks.data || []);
  renderFood(food.data || []);
}

function renderProgramme(prog){
  const host = document.getElementById('progBox');
  host.replaceChildren();
  const panel = el('div', { class:'panel' });

  if(prog){
    const t = today();
    const live = prog.start_date <= t && prog.end_date >= t;
    const info = el('p', { class:'subtle',
      text: fmt(prog.start_date) + ' \u2013 ' + fmt(prog.end_date) +
            (live ? ' \u00b7 running' : ' \u00b7 not running') });
    info.style.marginBottom = '14px';
    panel.append(info);
  } else {
    const info = el('p', { class:'subtle', text:'No programme yet.' });
    info.style.marginBottom = '14px';
    panel.append(info);
  }

  const g = el('div', { class:'grid2' });
  const startWrap = document.createElement('div');
  startWrap.append(el('label', { text:'Start', attrs:{ for:'pStart' } }));
  const start = el('input', { attrs:{ type:'date', id:'pStart' } });
  start.value = prog ? prog.start_date : today();
  startWrap.append(start);

  const lenWrap = document.createElement('div');
  lenWrap.append(el('label', { text:'Days', attrs:{ for:'pLen' } }));
  const len = el('input', { attrs:{ type:'number', id:'pLen', min:'1', max:'365' } });
  len.value = prog
    ? Math.round((new Date(prog.end_date) - new Date(prog.start_date)) / 86400000) + 1
    : 90;
  lenWrap.append(len);

  g.append(startWrap, lenWrap);
  panel.append(g);

  const ph = el('label', { text:'Phase', attrs:{ for:'pPhase' } });
  ph.style.marginTop = '14px';
  panel.append(ph);
  const phase = el('input', { attrs:{ type:'text', id:'pPhase', placeholder:'Reset' } });
  phase.value = prog && prog.phase ? prog.phase : '';
  panel.append(phase);

  const nl = el('label', { text:'Note shown to the patient', attrs:{ for:'pNote' } });
  nl.style.marginTop = '14px';
  panel.append(nl);
  const note = el('textarea', { attrs:{ id:'pNote',
    placeholder:'These first weeks are about taking things out, not adding them in.' } });
  note.value = prog && prog.phase_note ? prog.phase_note : '';
  panel.append(note);

  const save = el('button', { class:'primary',
    text: prog ? 'Update programme' : 'Create programme', attrs:{ type:'button' } });
  save.addEventListener('click', () => saveProgramme(prog, save));
  panel.append(save);

  host.append(panel);
}

async function saveProgramme(existing, btn){
  clear('alert3');
  btn.disabled = true; btn.textContent = 'Saving';

  const start = document.getElementById('pStart').value;
  const days  = parseInt(document.getElementById('pLen').value, 10);

  if(!start || !days || days < 1){
    say('Set a start date and a length in days.', 'alert3');
    btn.disabled = false; btn.textContent = existing ? 'Update programme' : 'Create programme';
    return;
  }

  const end = new Date(start + 'T00:00:00');
  end.setDate(end.getDate() + days - 1);

  const row = {
    client_id: current.id,
    start_date: start,
    end_date: end.toLocaleDateString('en-CA'),
    phase: document.getElementById('pPhase').value.trim() || null,
    phase_note: document.getElementById('pNote').value.trim() || null
  };

  const res = existing
    ? await db.from('programmes').update(row).eq('id', existing.id)
    : await db.from('programmes').insert(row);

  if(res.error){
    say('That did not save: ' + res.error.message, 'alert3');
    btn.disabled = false; btn.textContent = existing ? 'Update programme' : 'Create programme';
    return;
  }
  openPatient(current);
}

function renderSupplements(items){
  const host = document.getElementById('suppBox');
  host.replaceChildren();

  if(items.length > 0){
    const ul = el('ul', { class:'stack' });
    items.forEach(s => {
      const li = document.createElement('li');
      const box = el('div', { class:'name', text: s.name });
      box.append(el('span', { class:'dose',
        text: [s.dosage, s.timing, s.active ? null : 'stopped'].filter(Boolean).join(' \u00b7 ') }));
      li.append(box);

      const rm = el('button', { class:'tick', text:'\u00d7',
        attrs:{ type:'button', 'aria-label':'Remove ' + s.name } });
      rm.style.color = 'var(--err-ink)';
      rm.addEventListener('click', async () => {
        if(!confirm('Remove ' + s.name + ' from this patient\u2019s stack?')) return;
        const { error } = await db.from('client_supplements').delete().eq('id', s.id);
        if(error) say('Could not remove that.', 'alert3'); else openPatient(current);
      });
      li.append(rm);
      ul.append(li);
    });
    host.append(ul);
  } else {
    host.append(el('div', { class:'empty', text:'Nothing prescribed yet.' }));
  }

  const panel = el('div', { class:'panel' });
  panel.style.marginTop = '12px';
  panel.append(el('label', { text:'Add a supplement', attrs:{ for:'sName' } }));
  panel.append(el('input', { attrs:{ type:'text', id:'sName', placeholder:'Magnesium glycinate' } }));

  const g = el('div', { class:'grid2' });
  g.style.marginTop = '12px';
  const dw = document.createElement('div');
  dw.append(el('label', { text:'Dose', attrs:{ for:'sDose' } }));
  dw.append(el('input', { attrs:{ type:'text', id:'sDose', placeholder:'400mg' } }));
  const tw = document.createElement('div');
  tw.append(el('label', { text:'When', attrs:{ for:'sWhen' } }));
  const sel = el('select', { attrs:{ id:'sWhen' } });
  ['morning','evening','both'].forEach(o => sel.append(el('option', { text:o, attrs:{ value:o } })));
  tw.append(sel);
  g.append(dw, tw);
  panel.append(g);

  const add = el('button', { class:'primary', text:'Add to stack', attrs:{ type:'button' } });
  add.addEventListener('click', async () => {
    const name = document.getElementById('sName').value.trim();
    if(!name){ say('Give the supplement a name.', 'alert3'); return; }
    add.disabled = true; add.textContent = 'Adding';
    const { error } = await db.from('client_supplements').insert({
      client_id: current.id,
      name,
      dosage: document.getElementById('sDose').value.trim() || null,
      timing: document.getElementById('sWhen').value,
      active: true,
      sort_order: items.length + 1
    });
    if(error){
      say('Could not add that: ' + error.message, 'alert3');
      add.disabled = false; add.textContent = 'Add to stack';
      return;
    }
    openPatient(current);
  });
  panel.append(add);
  host.append(panel);
}

function renderChecks(rows){
  const host = document.getElementById('checkBox');
  host.replaceChildren();

  if(rows.length === 0){
    host.append(el('div', { class:'empty', text:'No check-ins logged yet.' }));
    return;
  }

  const panel = el('div', { class:'panel' });
  rows.forEach(r => {
    const line = el('div', { class:'logline' });
    line.append(el('span', { text: fmt(r.log_date) }));
    line.append(el('span', { class:'subtle',
      text:'E' + r.energy + ' \u00b7 S' + r.sleep + ' \u00b7 P' + r.pain }));
    panel.append(line);
    if(r.note){
      const n = el('p', { class:'subtle', text: r.note });
      n.style.cssText = 'padding:2px 0 8px;font-style:italic';
      panel.append(n);
    }
  });
  host.append(panel);
}

function renderFood(rows){
  const host = document.getElementById('foodBox');
  host.replaceChildren();

  if(rows.length === 0){
    host.append(el('div', { class:'empty', text:'No meals logged yet.' }));
    return;
  }

  const panel = el('div', { class:'panel' });
  rows.forEach(r => {
    const line = el('div', { class:'logline' });
    const left = document.createElement('div');
    left.append(el('div', { text: r.description || '(no description)' }));
    left.append(el('div', { class:'subtle', text: fmt(r.log_date) + ' \u00b7 ' + r.meal_slot }));
    line.append(left);
    if(r.felt_after) line.append(el('span', { class:'subtle', text: r.felt_after + '/5' }));
    panel.append(line);
  });
  host.append(panel);
}

/* Resume an existing session on load */
(async function(){
  const { data:{ session } } = await db.auth.getSession();
  if(session) await afterLogin();
})();
</script>
</body>
</html>
