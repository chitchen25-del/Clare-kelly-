<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Pinch-zoom deliberately enabled. Do not add user-scalable=no. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practitioner | The Natural Healing Clinic</title>
<link rel="apple-touch-icon" href="./logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./vip.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script>
<style>
  .row{background:var(--card);border:1px solid var(--hair);border-radius:18px;
       padding:19px 20px;margin-bottom:11px;display:flex;align-items:center;gap:14px;
       cursor:pointer;width:100%;text-align:left;font-family:inherit;font-size:1rem;
       box-shadow:var(--lift-sm);transition:box-shadow .15s ease}
  .row:active{box-shadow:var(--lift)}
  .row .who{flex:1;min-width:0}
  .row .nm{font-weight:600;font-size:.98rem}
  .row .sub{font-size:.78rem;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .pill{font-size:.6rem;font-weight:700;padding:5px 11px;border-radius:20px;flex:none;
        letter-spacing:.09em;text-transform:uppercase}
  .pill.on{background:rgba(23,160,74,.12);color:var(--forest-mid)}
  .pill.off{background:var(--bone);color:var(--ink-faint)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .back{background:none;border:none;color:var(--forest-mid);font-family:inherit;
        font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
        padding:22px 0 12px;cursor:pointer}
  .subtle{font-size:.82rem;color:var(--ink-faint)}
  .logline{display:flex;justify-content:space-between;gap:12px;padding:13px 0;
           border-bottom:1px solid var(--hair);font-size:.9rem}
  .logline:last-child{border-bottom:none}
  .view{display:none}.view.on{display:block}

  /* Patients / News switch */
  .seg{display:flex;gap:6px;background:var(--bone);border-radius:12px;padding:4px;margin-bottom:22px}
  .seg button{flex:1;min-height:42px;border:none;border-radius:9px;background:transparent;
       font-family:inherit;font-size:.7rem;font-weight:700;letter-spacing:.1em;
       text-transform:uppercase;color:var(--ink-soft);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--forest);box-shadow:var(--lift-sm)}

  /* News */
  .post{background:var(--card);border:1px solid var(--hair);border-radius:18px;
        padding:16px;margin-bottom:12px;display:flex;gap:14px;box-shadow:var(--lift-sm)}
  .post img{width:64px;height:64px;flex:none;border-radius:12px;object-fit:cover;background:var(--bone)}
  .post .body{flex:1;min-width:0}
  .post .t{font-weight:600;font-size:.95rem;line-height:1.35}
  .post .d{font-size:.74rem;color:var(--ink-faint);margin-top:3px;letter-spacing:.04em}
  .post .tags{font-size:.66rem;color:var(--forest-mid);font-weight:700;letter-spacing:.1em;
        text-transform:uppercase;margin-top:6px}
  .binbtn{width:38px;height:38px;flex:none;border:1px solid var(--err-line);border-radius:50%;
        background:var(--card);color:var(--err-ink);font-size:1rem;cursor:pointer;align-self:center}
  .filehint{font-size:.74rem;color:var(--ink-faint);margin:-8px 0 16px;line-height:1.5}
  .ok{background:rgba(23,160,74,.1);border:1px solid rgba(23,160,74,.3);color:var(--forest);
      border-radius:12px;padding:14px 16px;font-size:.88rem;margin-bottom:20px}
</style>
</head>
<body class="no-nav">

<div class="wrap">

  <!-- LOGIN -->
  <div id="v-login" class="view on">
    <div style="text-align:center;padding:56px 0 24px">
      <img src="./logo.png" alt="" style="height:60px;object-fit:contain">
      <h1 class="display" style="font-size:1.8rem;margin-top:16px">Practitioner</h1>
    </div>
    <div id="alert"></div>
    <div class="panel">
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" style="margin-bottom:16px" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit" class="primary" id="loginBtn">Sign in</button>
      </form>
    </div>
  </div>

  <!-- PATIENT LIST -->
  <div id="v-list" class="view">
    <div class="band">
      <p class="greet" id="whoami">&nbsp;</p>
      <p class="display" style="font-size:2.5rem">Patients</p>
    </div>

    <div class="seg" role="group" aria-label="Section">
      <button type="button" id="segPatients" aria-pressed="true">Patients</button>
      <button type="button" id="segNews" aria-pressed="false">News</button>
    </div>

    <div id="alert2"></div>
    <div id="patientList"></div>
    <button type="button" class="ghost danger" id="signOut" style="margin-top:24px">Sign out</button>
  </div>

  <!-- NEWS -->
  <div id="v-news" class="view">
    <div class="band">
      <p class="greet">Published to the Latest News page</p>
      <p class="display" style="font-size:2.5rem">News</p>
    </div>

    <div class="seg" role="group" aria-label="Section">
      <button type="button" id="segPatients2" aria-pressed="false">Patients</button>
      <button type="button" id="segNews2" aria-pressed="true">News</button>
    </div>

    <div id="alert4"></div>

    <section>
      <h3>Add a post</h3>
      <div class="panel">
        <label for="nTitle">Title</label>
        <input type="text" id="nTitle" placeholder="Migraine September Offer" style="margin-bottom:16px">

        <label for="nDesc">What you want people to read</label>
        <textarea id="nDesc" placeholder="In support of migraine awareness week in September, the clinic is offering&hellip;"></textarea>

        <label for="nImage" style="margin-top:16px">Photo (optional)</label>
        <input type="file" id="nImage" accept="image/*">
        <p class="filehint">Shown at the top of the post. JPG, PNG, WEBP or HEIC, up to 10MB.</p>

        <label for="nPdf">PDF (optional)</label>
        <input type="file" id="nPdf" accept="application/pdf">
        <p class="filehint">Adds a download button to the post. Up to 10MB.</p>

        <button type="button" class="primary" id="nPublish">Publish post</button>
      </div>
    </section>

    <section>
      <h3>Published</h3>
      <div id="newsList"></div>
    </section>

    <button type="button" class="ghost danger" id="signOut2" style="margin-top:24px">Sign out</button>
  </div>

  <!-- PATIENT DETAIL -->
  <div id="v-detail" class="view">
    <button type="button" class="back" id="backBtn">&larr; All patients</button>
    <div class="band" style="margin-top:0">
      <p class="greet" id="dEmail">&nbsp;</p>
      <p class="display" style="font-size:2.2rem" id="dName">&nbsp;</p>
    </div>
    <div id="alert3"></div>

    <section>
      <h3>Programme</h3>
      <div id="progBox"></div>
    </section>

    <section>
      <h3>Supplements</h3>
      <div id="suppBox"></div>
    </section>

    <section>
      <h3>Recent check-ins</h3>
      <div id="checkBox"></div>
    </section>

    <section>
      <h3>Recent meals</h3>
      <div id="foodBox"></div>
    </section>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://oegojjgvnsyjuffxtkuv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Twf2fn7Ay35v_ZEIw3iliA_UQwzuBgU';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const NEWS_BUCKET = 'latest-news';
const MAX_UPLOAD = 10 * 1024 * 1024;

/* Every value from the database goes in with textContent, never innerHTML.
   A patient can type into some of these fields; a practitioner session must
   never execute what they typed. */
function el(tag, o = {}){
  const n = document.createElement(tag);
  if(o.class) n.className = o.class;
  if(o.text != null) n.textContent = o.text;
  if(o.attrs) for(const [k,v] of Object.entries(o.attrs)) n.setAttribute(k,v);
  return n;
}
const today = () => new Date().toLocaleDateString('en-CA');
const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB',
  { day:'numeric', month:'short', year:'numeric' });
const fmtStamp = d => new Date(d).toLocaleDateString('en-GB',
  { day:'numeric', month:'long', year:'numeric' });

function say(msg, host = 'alert'){
  const h = document.getElementById(host);
  if(h) h.replaceChildren(el('div', { class:'err', text: msg }));
}
function good(msg, host = 'alert'){
  const h = document.getElementById(host);
  if(h) h.replaceChildren(el('div', { class:'ok', text: msg }));
}
function clear(host = 'alert'){
  const h = document.getElementById(host);
  if(h) h.replaceChildren();
}
function show(view){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.getElementById('v-' + view).classList.add('on');
  window.scrollTo(0,0);
}

let current = null;   // patient being viewed

/* ---------------- Auth ---------------- */

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  clear();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Checking';

  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });

  if(error){
    say('That email and password did not match.');
    btn.disabled = false; btn.textContent = 'Sign in';
    return;
  }
  await afterLogin();
  btn.disabled = false; btn.textContent = 'Sign in';
});

/* The real gate. Signing in is not enough — the account must be staff.
   RLS would hide the data anyway, but this stops the page opening at all. */
async function afterLogin(){
  const { data: staff, error } = await db.rpc('is_staff');

  if(error || staff !== true){
    await db.auth.signOut();
    say('That account does not have practitioner access.');
    return;
  }

  const { data:{ user } } = await db.auth.getUser();
  document.getElementById('whoami').textContent = 'Signed in as ' + user.email;
  show('list');
  loadPatients();
}

['signOut','signOut2'].forEach(id => {
  document.getElementById(id).addEventListener('click', async () => {
    await db.auth.signOut();
    location.reload();
  });
});

/* ---------------- Section switch ---------------- */

['segNews','segNews2'].forEach(id =>
  document.getElementById(id).addEventListener('click', () => { show('news'); loadNews(); }));
['segPatients','segPatients2'].forEach(id =>
  document.getElementById(id).addEventListener('click', () => { show('list'); loadPatients(); }));

/* ---------------- News ---------------- */

async function loadNews(){
  const host = document.getElementById('newsList');
  host.replaceChildren(el('p', { class:'subtle', text:'Loading…' }));

  const { data, error } = await db.from('clinic_news')
    .select('*').order('created_at', { ascending:false });

  host.replaceChildren();

  if(error){ say('Could not load the news posts.', 'alert4'); return; }

  if(!data || data.length === 0){
    host.append(el('div', { class:'empty',
      text:'Nothing published yet. Posts you add appear on the Latest News page straight away.' }));
    return;
  }

  data.forEach(post => {
    const card = el('div', { class:'post' });

    const img = el('img', { attrs:{ alt:'', loading:'lazy' } });
    if(post.image_url) img.src = post.image_url;
    card.append(img);

    const body = el('div', { class:'body' });
    body.append(el('p', { class:'t', text: post.title }));
    if(post.created_at) body.append(el('p', { class:'d', text: fmtStamp(post.created_at) }));

    const tags = [];
    if(post.image_url) tags.push('Photo');
    if(post.pdf_url) tags.push('PDF');
    if(tags.length) body.append(el('p', { class:'tags', text: tags.join(' \u00b7 ') }));
    card.append(body);

    const bin = el('button', { class:'binbtn', text:'\u00d7',
      attrs:{ type:'button', 'aria-label':'Delete ' + post.title } });
    bin.addEventListener('click', () => deletePost(post, bin));
    card.append(bin);

    host.append(card);
  });
}

/* Storage path back out of a public URL, so deleting a post also removes
   its files instead of leaving them orphaned in the bucket. */
function pathFromUrl(url){
  if(!url) return null;
  const marker = '/object/public/' + NEWS_BUCKET + '/';
  const i = url.indexOf(marker);
  return i === -1 ? null : decodeURIComponent(url.slice(i + marker.length));
}

async function deletePost(post, btn){
  if(!confirm('Delete "' + post.title + '" from the news page?')) return;
  btn.disabled = true;
  clear('alert4');

  const { error } = await db.from('clinic_news').delete().eq('id', post.id);
  if(error){
    say('Could not delete that post.', 'alert4');
    btn.disabled = false;
    return;
  }

  const paths = [pathFromUrl(post.image_url), pathFromUrl(post.pdf_url)].filter(Boolean);
  if(paths.length) await db.storage.from(NEWS_BUCKET).remove(paths);

  loadNews();
}

/* Strip anything that would make an awkward storage key. */
function safeName(name){
  return name.replace(/[^A-Za-z0-9._-]/g, '_').slice(-60);
}

async function uploadNewsFile(file){
  if(file.size > MAX_UPLOAD){
    throw new Error('"' + file.name + '" is over 10MB. Try a smaller file.');
  }
  const path = Date.now() + '-' + safeName(file.name);
  const { error } = await db.storage.from(NEWS_BUCKET)
    .upload(path, file, { contentType: file.type, upsert: false });
  if(error) throw new Error('Could not upload "' + file.name + '". ' + error.message);
  return db.storage.from(NEWS_BUCKET).getPublicUrl(path).data.publicUrl;
}

document.getElementById('nPublish').addEventListener('click', async () => {
  const btn = document.getElementById('nPublish');
  const title = document.getElementById('nTitle').value.trim();
  const desc  = document.getElementById('nDesc').value.trim();
  const image = document.getElementById('nImage').files[0];
  const pdf   = document.getElementById('nPdf').files[0];

  clear('alert4');

  if(!title){ say('Give the post a title.', 'alert4'); return; }
  if(!desc){ say('Add some text for people to read.', 'alert4'); return; }

  btn.disabled = true;
  btn.textContent = 'Publishing';

  const uploaded = [];
  try{
    let imageUrl = null, pdfUrl = null;
    if(image){ imageUrl = await uploadNewsFile(image); uploaded.push(imageUrl); }
    if(pdf){   pdfUrl   = await uploadNewsFile(pdf);   uploaded.push(pdfUrl); }

    const { error } = await db.from('clinic_news').insert({
      title, description: desc, image_url: imageUrl, pdf_url: pdfUrl
    });
    if(error) throw new Error('The post did not save. ' + error.message);

    document.getElementById('nTitle').value = '';
    document.getElementById('nDesc').value = '';
    document.getElementById('nImage').value = '';
    document.getElementById('nPdf').value = '';

    good('Published. It is live on the news page now.', 'alert4');
    loadNews();
  } catch(err){
    // Don't leave uploaded files behind if the row failed to save.
    const paths = uploaded.map(pathFromUrl).filter(Boolean);
    if(paths.length) await db.storage.from(NEWS_BUCKET).remove(paths);
    say(err.message, 'alert4');
  }

  btn.disabled = false;
  btn.textContent = 'Publish post';
});

/* ---------------- Patient list ---------------- */

async function loadPatients(){
  const host = document.getElementById('patientList');
  host.replaceChildren(el('p', { class:'subtle', text:'Loading…' }));

  const [{ data: people, error }, { data: progs }] = await Promise.all([
    db.from('profiles').select('*').eq('role','patient').order('created_at'),
    db.from('programmes').select('client_id,start_date,end_date')
  ]);

  if(error){ say('Could not load patients.', 'alert2'); host.replaceChildren(); return; }

  host.replaceChildren();
  if(!people || people.length === 0){
    host.append(el('div', { class:'empty',
      text:'No patients yet. Accounts appear here once someone signs up.' }));
    return;
  }

  const t = today();
  const activeIds = new Set((progs||[])
    .filter(p => p.start_date <= t && p.end_date >= t)
    .map(p => p.client_id));

  people.forEach(p => {
    const btn = el('button', { class:'row', attrs:{ type:'button' } });
    const who = el('div', { class:'who' });
    who.append(el('div', { class:'nm', text: p.full_name || 'Unnamed patient' }));
    who.append(el('div', { class:'sub', text: p.email || '' }));
    btn.append(who);
    btn.append(el('span', {
      class: 'pill ' + (activeIds.has(p.id) ? 'on' : 'off'),
      text: activeIds.has(p.id) ? 'Active' : 'No programme'
    }));
    btn.addEventListener('click', () => openPatient(p));
    host.append(btn);
  });
}

document.getElementById('backBtn').addEventListener('click', () => {
  show('list'); loadPatients();
});

/* ---------------- Patient detail ---------------- */

async function openPatient(p){
  current = p;
  show('detail');
  clear('alert3');
  document.getElementById('dName').textContent = p.full_name || 'Unnamed patient';
  document.getElementById('dEmail').textContent = p.email || '';

  ['progBox','suppBox','checkBox','foodBox'].forEach(id =>
    document.getElementById(id).replaceChildren(el('p', { class:'subtle', text:'Loading…' })));

  const [prog, supps, checks, food] = await Promise.all([
    db.from('programmes').select('*').eq('client_id', p.id)
      .order('start_date',{ascending:false}).limit(1).maybeSingle(),
    db.from('client_supplements').select('*').eq('client_id', p.id).order('sort_order'),
    db.from('daily_checkins').select('*').eq('client_id', p.id)
      .order('log_date',{ascending:false}).limit(14),
    db.from('food_log').select('*').eq('client_id', p.id)
      .order('log_date',{ascending:false}).limit(15)
  ]);

  renderProgramme(prog.data);
  renderSupplements(supps.data || []);
  renderChecks(checks.data || []);
  renderFood(food.data || []);
}

function renderProgramme(prog){
  const host = document.getElementById('progBox');
  host.replaceChildren();
  const panel = el('div', { class:'panel' });

  if(prog){
    const t = today();
    const live = prog.start_date <= t && prog.end_date >= t;
    const info = el('p', { class:'subtle',
      text: fmt(prog.start_date) + ' \u2013 ' + fmt(prog.end_date) +
            (live ? ' \u00b7 running' : ' \u00b7 not running') });
    info.style.marginBottom = '14px';
    panel.append(info);
  } else {
    const info = el('p', { class:'subtle', text:'No programme yet.' });
    info.style.marginBottom = '14px';
    panel.append(info);
  }

  const g = el('div', { class:'grid2' });
  const startWrap = document.createElement('div');
  startWrap.append(el('label', { text:'Start', attrs:{ for:'pStart' } }));
  const start = el('input', { attrs:{ type:'date', id:'pStart' } });
  start.value = prog ? prog.start_date : today();
  startWrap.append(start);

  const lenWrap = document.createElement('div');
  lenWrap.append(el('label', { text:'Days', attrs:{ for:'pLen' } }));
  const len = el('input', { attrs:{ type:'number', id:'pLen', min:'1', max:'365' } });
  len.value = prog
    ? Math.round((new Date(prog.end_date) - new Date(prog.start_date)) / 86400000) + 1
    : 90;
  lenWrap.append(len);

  g.append(startWrap, lenWrap);
  panel.append(g);

  const ph = el('label', { text:'Phase', attrs:{ for:'pPhase' } });
  ph.style.marginTop = '14px';
  panel.append(ph);
  const phase = el('input', { attrs:{ type:'text', id:'pPhase', placeholder:'Reset' } });
  phase.value = prog && prog.phase ? prog.phase : '';
  panel.append(phase);

  const nl = el('label', { text:'Note shown to the patient', attrs:{ for:'pNote' } });
  nl.style.marginTop = '14px';
  panel.append(nl);
  const note = el('textarea', { attrs:{ id:'pNote',
    placeholder:'These first weeks are about taking things out, not adding them in.' } });
  note.value = prog && prog.phase_note ? prog.phase_note : '';
  panel.append(note);

  const save = el('button', { class:'primary',
    text: prog ? 'Update programme' : 'Create programme', attrs:{ type:'button' } });
  save.addEventListener('click', () => saveProgramme(prog, save));
  panel.append(save);

  host.append(panel);
}

async function saveProgramme(existing, btn){
  clear('alert3');
  btn.disabled = true; btn.textContent = 'Saving';

  const start = document.getElementById('pStart').value;
  const days  = parseInt(document.getElementById('pLen').value, 10);

  if(!start || !days || days < 1){
    say('Set a start date and a length in days.', 'alert3');
    btn.disabled = false; btn.textContent = existing ? 'Update programme' : 'Create programme';
    return;
  }

  const end = new Date(start + 'T00:00:00');
  end.setDate(end.getDate() + days - 1);

  const row = {
    client_id: current.id,
    start_date: start,
    end_date: end.toLocaleDateString('en-CA'),
    phase: document.getElementById('pPhase').value.trim() || null,
    phase_note: document.getElementById('pNote').value.trim() || null
  };

  const res = existing
    ? await db.from('programmes').update(row).eq('id', existing.id)
    : await db.from('programmes').insert(row);

  if(res.error){
    say('That did not save: ' + res.error.message, 'alert3');
    btn.disabled = false; btn.textContent = existing ? 'Update programme' : 'Create programme';
    return;
  }
  openPatient(current);
}

function renderSupplements(items){
  const host = document.getElementById('suppBox');
  host.replaceChildren();

  if(items.length > 0){
    const ul = el('ul', { class:'stack' });
    items.forEach(s => {
      const li = document.createElement('li');
      const box = el('div', { class:'name', text: s.name });
      box.append(el('span', { class:'dose',
        text: [s.dosage, s.timing, s.active ? null : 'stopped'].filter(Boolean).join(' \u00b7 ') }));
      li.append(box);

      /* Stopping marks it inactive rather than deleting. Deleting cascades away
         the patient's tick history, which is the record of what they took. */
      if(s.active){
        const stop = el('button', { class:'tick', text:'\u00d7',
          attrs:{ type:'button', 'aria-label':'Stop ' + s.name } });
        stop.style.color = 'var(--err-ink)';
        stop.addEventListener('click', async () => {
          if(!confirm('Stop ' + s.name + '? It disappears from their list but the history is kept.')) return;
          const { error } = await db.from('client_supplements')
            .update({ active:false }).eq('id', s.id);
          if(error) say('Could not stop that.', 'alert3'); else openPatient(current);
        });
        li.append(stop);
      } else {
        const restart = el('button', { class:'tick', text:'\u21ba',
          attrs:{ type:'button', 'aria-label':'Restart ' + s.name } });
        restart.style.color = 'var(--forest-mid)';
        restart.addEventListener('click', async () => {
          const { error } = await db.from('client_supplements')
            .update({ active:true }).eq('id', s.id);
          if(error) say('Could not restart that.', 'alert3'); else openPatient(current);
        });
        li.append(restart);
      }

      ul.append(li);
    });
    host.append(ul);
  } else {
    host.append(el('div', { class:'empty', text:'Nothing prescribed yet.' }));
  }

  const panel = el('div', { class:'panel' });
  panel.style.marginTop = '12px';
  panel.append(el('label', { text:'Add a supplement', attrs:{ for:'sName' } }));
  panel.append(el('input', { attrs:{ type:'text', id:'sName', placeholder:'Magnesium glycinate' } }));

  const g = el('div', { class:'grid2' });
  g.style.marginTop = '12px';
  const dw = document.createElement('div');
  dw.append(el('label', { text:'Dose', attrs:{ for:'sDose' } }));
  dw.append(el('input', { attrs:{ type:'text', id:'sDose', placeholder:'400mg' } }));
  const tw = document.createElement('div');
  tw.append(el('label', { text:'When', attrs:{ for:'sWhen' } }));
  const sel = el('select', { attrs:{ id:'sWhen' } });
  ['morning','evening','both'].forEach(o => sel.append(el('option', { text:o, attrs:{ value:o } })));
  tw.append(sel);
  g.append(dw, tw);
  panel.append(g);

  const add = el('button', { class:'primary', text:'Add to stack', attrs:{ type:'button' } });
  add.addEventListener('click', async () => {
    const name = document.getElementById('sName').value.trim();
    if(!name){ say('Give the supplement a name.', 'alert3'); return; }
    add.disabled = true; add.textContent = 'Adding';
    const { error } = await db.from('client_supplements').insert({
      client_id: current.id,
      name,
      dosage: document.getElementById('sDose').value.trim() || null,
      timing: document.getElementById('sWhen').value,
      active: true,
      sort_order: items.length + 1
    });
    if(error){
      say('Could not add that: ' + error.message, 'alert3');
      add.disabled = false; add.textContent = 'Add to stack';
      return;
    }
    openPatient(current);
  });
  panel.append(add);
  host.append(panel);
}

function renderChecks(rows){
  const host = document.getElementById('checkBox');
  host.replaceChildren();

  if(rows.length === 0){
    host.append(el('div', { class:'empty', text:'No check-ins logged yet.' }));
    return;
  }

  const panel = el('div', { class:'panel' });
  rows.forEach(r => {
    const line = el('div', { class:'logline' });
    line.append(el('span', { text: fmt(r.log_date) }));
    line.append(el('span', { class:'subtle',
      text:'E' + r.energy + ' \u00b7 S' + r.sleep + ' \u00b7 P' + r.pain }));
    panel.append(line);
    if(r.note){
      const n = el('p', { class:'subtle', text: r.note });
      n.style.cssText = 'padding:2px 0 8px;font-style:italic';
      panel.append(n);
    }
  });
  host.append(panel);
}

function renderFood(rows){
  const host = document.getElementById('foodBox');
  host.replaceChildren();

  if(rows.length === 0){
    host.append(el('div', { class:'empty', text:'No meals logged yet.' }));
    return;
  }

  const panel = el('div', { class:'panel' });
  rows.forEach(r => {
    const line = el('div', { class:'logline' });
    const left = document.createElement('div');
    left.append(el('div', { text: r.description || '(no description)' }));
    left.append(el('div', { class:'subtle', text: fmt(r.log_date) + ' \u00b7 ' + r.meal_slot }));
    line.append(left);
    if(r.felt_after) line.append(el('span', { class:'subtle', text: r.felt_after + '/5' }));
    panel.append(line);
  });
  host.append(panel);
}

/* Resume an existing session on load */
(async function(){
  const { data:{ session } } = await db.auth.getSession();
  if(session) await afterLogin();
})();
</script>
